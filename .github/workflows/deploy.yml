name: Deploy Silaigo API

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NestJS
        run: npm run build

      - name: Prepare deployment
        run: |
          mkdir deployment
          cp -r dist deployment/
          cp package.json deployment/
          cp package-lock.json deployment/

      - name: Install production dependencies
        working-directory: deployment
        run: npm ci --omit=dev

      - name: Create archive
        run: tar -czf silaigo-api.tar.gz -C deployment .

      - name: Upload to Lightsail
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "silaigo-api.tar.gz"
          target: "/tmp"

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            APP_DIR="/var/www/silaigo-api"
            RELEASE_DIR="$APP_DIR/release"

            echo "Extracting deployment..."

            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"

            tar -xzf /tmp/silaigo-api.tar.gz -C "$RELEASE_DIR"

            echo "Checking deployment..."

            if [ ! -f "$RELEASE_DIR/package.json" ]; then
              echo "ERROR: package.json missing"
              exit 1
            fi

            if [ ! -d "$RELEASE_DIR/dist" ]; then
              echo "ERROR: dist directory missing"
              exit 1
            fi

            MAIN_FILE=$(find "$RELEASE_DIR/dist" -name "main.js" -type f | head -1)

            if [ -z "$MAIN_FILE" ]; then
              echo "ERROR: main.js not found"
              find "$RELEASE_DIR/dist" -maxdepth 4 -type f
              exit 1
            fi

            echo "Found NestJS entry point:"
            echo "$MAIN_FILE"

            echo "Replacing production files..."

            rm -rf "$APP_DIR/dist"
            rm -rf "$APP_DIR/node_modules"

            mv "$RELEASE_DIR/dist" "$APP_DIR/dist"
            mv "$RELEASE_DIR/node_modules" "$APP_DIR/node_modules"

            cp "$RELEASE_DIR/package.json" "$APP_DIR/package.json"
            cp "$RELEASE_DIR/package-lock.json" "$APP_DIR/package-lock.json"

            rm -rf "$RELEASE_DIR"
            rm -f /tmp/silaigo-api.tar.gz

            echo "Restarting PM2..."

            MAIN_FILE=$(find "$APP_DIR/dist" -name "main.js" -type f | head -1)

            if pm2 describe silaigo-api > /dev/null 2>&1; then
              pm2 restart silaigo-api --update-env
            else
              pm2 start "$MAIN_FILE" \
                --name silaigo-api \
                --cwd "$APP_DIR"
            fi

            pm2 save

            echo "Deployment successful"

            pm2 status