name: Deploy Silaigo API

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NestJS
        run: npm run build

      - name: Prepare deployment
        run: |
          mkdir deployment
          cp -r dist deployment/
          cp package.json deployment/
          cp package-lock.json deployment/

      - name: Install production dependencies
        working-directory: deployment
        run: npm ci --omit=dev

      - name: Create archive
        run: tar -czf silaigo-api.tar.gz -C deployment .

      - name: Upload to Lightsail
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "silaigo-api.tar.gz"
          target: "/tmp"

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            APP_DIR="/var/www/silaigo-api"

            mkdir -p "$APP_DIR/new"

            tar -xzf /tmp/silaigo-api.tar.gz -C "$APP_DIR/new"

            rm -rf "$APP_DIR/dist"
            rm -rf "$APP_DIR/node_modules"

            mv "$APP_DIR/new/dist" "$APP_DIR/dist"
            mv "$APP_DIR/new/node_modules" "$APP_DIR/node_modules"

            cp "$APP_DIR/new/package.json" "$APP_DIR/package.json"
            cp "$APP_DIR/new/package-lock.json" "$APP_DIR/package-lock.json"

            rm -rf "$APP_DIR/new"
            rm -f /tmp/silaigo-api.tar.gz

            if pm2 describe silaigo-api > /dev/null 2>&1; then
              pm2 restart silaigo-api --update-env
            else
              pm2 start dist/main.js --name silaigo-api
            fi

            pm2 save

            echo "Deployment successful"
